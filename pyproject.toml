[project]
name = "sntp-information-diffusion"
version = "1.0.0"
description = "Joint recommendation, social influence and information-diffusion study on the Epinions network (SNTP Assignment 2)"
readme = "README.md"
authors = [
    { name = "Muhammad Umar Afzaal", email = "umarafzaal182@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "scipy>=1.11",
    "tabulate>=0.10.0",
    "tqdm>=4.66",
]

[project.scripts]
sntp = "sntp.cli:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sntp"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
